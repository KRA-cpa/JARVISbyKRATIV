<svg xmlns="http://www.w3.org/2000/svg" class="tf light still" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="tf-t tf-d">
<title id="tf-t">Daloy: create a request, then the approval flow</title>
<desc id="tf-d">A requester types a purchase request (Laptop for new hire, 45,000) and clicks Submit; the form turns into ticket PR-2026-00000042, which goes to the first approver (Manager) and then through Finance and Done, ending Approved</desc>
<style>
.tf{--blue:#2563EB;--green:#22C55E;--on-green:#052E16}
.tf{--bg:#F8FAFC;--card:#FFFFFF;--node:#FFFFFF;--line:#CBD5E1;--track:#E2E8F0;--text:#0F172A;--muted:#64748B}
@media (prefers-color-scheme:dark){.tf:not(.light){--bg:#0B1220;--card:#131C2E;--node:#131C2E;--line:#3A4A63;--track:#26334A;--text:#E2E8F0;--muted:#94A3B8}}
.tf.dark{--bg:#0B1220;--card:#131C2E;--node:#131C2E;--line:#3A4A63;--track:#26334A;--text:#E2E8F0;--muted:#94A3B8}
.tf text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.track{stroke:var(--track);stroke-width:4;stroke-linecap:round}
.fill{stroke:var(--green);stroke-width:4;stroke-linecap:round;stroke-dasharray:106;stroke-dashoffset:0}
.nbase{fill:var(--node);stroke:var(--line);stroke-width:2}
.num{fill:var(--muted);font-size:15px;font-weight:600;text-anchor:middle}
.blue{fill:var(--blue)}
.green{fill:var(--green)}
.ring{fill:var(--blue);opacity:0;transform-box:fill-box;transform-origin:center}
.cface{fill:none;stroke:#fff;stroke-width:2}
.chand{stroke:#fff;stroke-width:2;stroke-linecap:round}
.hand{transform-box:fill-box;transform-origin:center}
.check,.pchk{fill:none;stroke:var(--on-green);stroke-linecap:round;stroke-linejoin:round}
.check{stroke-width:3}
.pchk{stroke-width:2.5}
.act{opacity:0}
.done{opacity:1;transform-box:fill-box;transform-origin:center}
.lbl{fill:var(--text);font-size:16px;font-weight:600;text-anchor:middle}
.card{transform:translateX(165px)}
.cardbg{fill:var(--card);stroke:var(--green);stroke-width:1.5}
.dot{fill:var(--green)}
.id{fill:var(--text);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{fill:var(--muted);font-size:15px}
.conn{stroke:var(--line);stroke-width:2;stroke-dasharray:3 4;stroke-linecap:round;opacity:0}
.pill{transform-box:fill-box;transform-origin:center}
.pillbg{fill:var(--green)}
.pilltx{fill:var(--on-green);font-size:17px;font-weight:700}
.card{animation:card 10s cubic-bezier(.4,0,.2,1) infinite}
.cardbg{animation:cardline 10s ease infinite}
.dot{animation:dot 10s ease infinite}
.conn{animation:conn 10s ease infinite}
.pill{animation:pill 10s ease infinite}
.a1{animation:a1 10s ease infinite}
.a2{animation:a2 10s ease infinite}
.a3{animation:a3 10s ease infinite}
.d1{animation:d1 10s ease infinite}
.d2{animation:d2 10s ease infinite}
.d3{animation:d3 10s ease infinite}
.f1{animation:f1 10s cubic-bezier(.4,0,.2,1) infinite}
.f2{animation:f2 10s cubic-bezier(.4,0,.2,1) infinite}
.l1{animation:l1 10s ease infinite}
.l2{animation:l2 10s ease infinite}
.l3{animation:l3 10s ease infinite}
.ring{animation:pulse 1.4s ease-out infinite}
.hand{animation:tick 1.4s steps(8,end) infinite}
@keyframes card{0%,24%{transform:translateX(15px);opacity:0}27%{transform:translateX(15px);opacity:1}50.3%{transform:translateX(15px)}55.9%{transform:translateX(165px)}69.9%{transform:translateX(165px)}75.5%{transform:translateX(315px)}83.9%{transform:translateX(315px)}89.5%{transform:translateX(165px)}96.5%{transform:translateX(165px);opacity:1}99.3%,100%{transform:translateX(165px);opacity:0}}
@keyframes cardline{0%,30%,83.9%{stroke:var(--blue)}88.1%,100%{stroke:var(--green)}}
@keyframes dot{0%,30%,83.9%{fill:var(--blue)}88.1%,100%{fill:var(--green)}}
@keyframes conn{0%,27%{opacity:0}28%,83.2%{opacity:1}86%,100%{opacity:0}}
@keyframes pill{0%,30%,86%{opacity:0;transform:scale(.6)}89.5%{opacity:1;transform:scale(1.06)}91.6%,96.5%{opacity:1;transform:scale(1)}99.3%,100%{opacity:0;transform:scale(1)}}
@keyframes a1{0%,30.5%{opacity:0}31.5%,48.9%{opacity:1}51%,100%{opacity:0}}
@keyframes a2{0%,30%,54.5%{opacity:0}56.6%,68.5%{opacity:1}70.6%,100%{opacity:0}}
@keyframes a3{0%,30%,74.8%{opacity:0}76.9%,81.1%{opacity:1}83.2%,100%{opacity:0}}
@keyframes d1{0%,30%,49.6%{opacity:0;transform:scale(.5)}51.7%{opacity:1;transform:scale(1.12)}53.8%,96.5%{opacity:1;transform:scale(1)}99.3%,100%{opacity:0;transform:scale(1)}}
@keyframes d2{0%,30%,69.2%{opacity:0;transform:scale(.5)}71.3%{opacity:1;transform:scale(1.12)}73.4%,96.5%{opacity:1;transform:scale(1)}99.3%,100%{opacity:0;transform:scale(1)}}
@keyframes d3{0%,30%,81.8%{opacity:0;transform:scale(.5)}83.9%{opacity:1;transform:scale(1.12)}86%,96.5%{opacity:1;transform:scale(1)}99.3%,100%{opacity:0;transform:scale(1)}}
@keyframes f1{0%,30%,50.3%{stroke-dashoffset:106;opacity:1}54.5%,96.5%{stroke-dashoffset:0;opacity:1}99.3%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes f2{0%,30%,69.9%{stroke-dashoffset:106;opacity:1}74.1%,96.5%{stroke-dashoffset:0;opacity:1}99.3%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes l1{0%,30.5%{fill:var(--muted)}31.5%,96.5%{fill:var(--text)}99.3%,100%{fill:var(--muted)}}
@keyframes l2{0%,30%,54.5%{fill:var(--muted)}56.6%,96.5%{fill:var(--text)}99.3%,100%{fill:var(--muted)}}
@keyframes l3{0%,30%,74.8%{fill:var(--muted)}76.9%,96.5%{fill:var(--text)}99.3%,100%{fill:var(--muted)}}
@keyframes pulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.6);opacity:0}}
@keyframes tick{to{transform:rotate(360deg)}}
/* creation phase (0-30% of the 10s loop): form in, typing, cursor clicks Submit, form turns into the ticket card */
.form{opacity:0}
.fbg{fill:var(--card);stroke:var(--blue);stroke-width:1.5}
.ftitle{fill:var(--text);font-size:15px;font-weight:700}
.flabel{fill:var(--muted);font-size:12px}
.finput{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.ftext{fill:var(--text);font-size:14px}
.btnbg{fill:var(--blue)}
.btntx{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
.btn{transform-box:fill-box;transform-origin:center}
.cur{opacity:0}
.curp{fill:var(--text);stroke:var(--card);stroke-width:1.2;stroke-linejoin:round}
.t1,.t2{transform-box:fill-box;transform-origin:left center;transform:scaleX(1)}
.form{animation:form 10s ease infinite}
.t1{animation:t1 10s linear infinite}
.t2{animation:t2 10s linear infinite}
.cur{animation:cur 10s ease-in-out infinite}
.btn{animation:btn 10s ease infinite}
.btnbg{animation:btnbg 10s ease infinite}
@keyframes form{0%{opacity:0;transform:translateY(8px)}3%,28%{opacity:1;transform:translateY(0)}29%,100%{opacity:0;transform:translateY(0)}}
.fbg{transform-box:fill-box;transform-origin:top center;animation:fbg 10s cubic-bezier(.4,0,.2,1) infinite}
.ftitle{animation:ftitle 10s ease infinite}
.ffields{animation:ffields 10s ease infinite}
.tok{fill:var(--blue);opacity:0;animation:tok 10s cubic-bezier(.4,0,.2,1) infinite}
@keyframes fbg{0%,24.5%{transform:scaleY(1);opacity:1}27.5%{transform:scaleY(.6);opacity:1}28.5%,100%{transform:scaleY(.6);opacity:0}}
@keyframes ftitle{0%,24%{opacity:1}25.5%,100%{opacity:0}}
@keyframes ffields{0%,23.5%{opacity:1}25.5%,100%{opacity:0}}
@keyframes tok{0%,27.8%{opacity:0;transform:translateY(0)}28.3%{opacity:1;transform:translateY(0)}30.3%{opacity:1;transform:translateY(64px)}31%,100%{opacity:0;transform:translateY(64px)}}
@keyframes t1{0%,4%{transform:scaleX(0);animation-timing-function:steps(19,end)}12%,100%{transform:scaleX(1)}}
@keyframes t2{0%,13%{transform:scaleX(0);animation-timing-function:steps(6,end)}17%,100%{transform:scaleX(1)}}
@keyframes cur{0%,16%{opacity:0;transform:translate(70px,46px)}18%{opacity:1;transform:translate(70px,46px)}21.5%,24%{opacity:1;transform:translate(0,0)}26%,100%{opacity:0;transform:translate(0,0)}}
@keyframes btn{0%,21.5%{transform:scale(1)}22.5%{transform:scale(.92)}23.5%,100%{transform:scale(1)}}
@keyframes btnbg{0%,21.5%{fill:var(--blue)}22.5%,100%{fill:#1D4ED8}}
.still *{animation:none!important}
@media (prefers-reduced-motion:reduce){.tf *{animation:none!important}}
</style>
<defs>
<clipPath id="tf-c1"><rect class="t1" x="39" y="87" width="170" height="20"></rect></clipPath>
<clipPath id="tf-c2"><rect class="t2" x="39" y="135" width="60" height="20"></rect></clipPath>
</defs>
<rect class="bg" width="560" height="280" rx="20"></rect>
<g class="form">
<rect class="fbg" x="15" y="28" width="230" height="140" rx="14"></rect>
<text class="ftitle" x="33" y="58">New purchase request</text>
<g class="ffields">
<text class="flabel" x="33" y="78">Item</text>
<rect class="finput" x="31" y="83" width="198" height="26" rx="6"></rect>
<text class="ftext" x="39" y="101" clip-path="url(#tf-c1)">Laptop for new hire</text>
<text class="flabel" x="33" y="126">Amount (PHP)</text>
<rect class="finput" x="31" y="131" width="118" height="26" rx="6"></rect>
<text class="ftext" x="39" y="149" clip-path="url(#tf-c2)">45,000</text>
<g class="btn"><rect class="btnbg" x="161" y="131" width="68" height="26" rx="6"></rect><text class="btntx" x="195" y="148.5">Submit</text></g>
<g class="cur"><g transform="translate(196 141)"><path class="curp" d="M0 0L0 16L4.5 12L7.5 18.5L10 17.3L7 11L12.5 11Z"></path></g></g>
</g>
</g>
<line class="track" x1="152" y1="204" x2="258" y2="204"></line>
<line class="track" x1="302" y1="204" x2="408" y2="204"></line>
<line class="fill f1" x1="152" y1="204" x2="258" y2="204"></line>
<line class="fill f2" x1="302" y1="204" x2="408" y2="204"></line>
<g transform="translate(130 204)"><circle class="nbase" r="22"></circle><text class="num" y="5">1</text><g class="act a1"><circle class="ring" r="22"></circle><circle class="blue" r="22"></circle><circle class="cface" r="9"></circle><line class="chand" x1="0" y1="0" x2="4" y2="2"></line><g class="hand"><rect x="-9" y="-9" width="18" height="18" fill="none"></rect><line class="chand" x1="0" y1="0" x2="0" y2="-6"></line></g></g><g class="done d1"><circle class="green" r="22"></circle><path class="check" d="M-8 0.5l5 5 10-11"></path></g></g>
<g transform="translate(280 204)"><circle class="nbase" r="22"></circle><text class="num" y="5">2</text><g class="act a2"><circle class="ring" r="22"></circle><circle class="blue" r="22"></circle><circle class="cface" r="9"></circle><line class="chand" x1="0" y1="0" x2="4" y2="2"></line><g class="hand"><rect x="-9" y="-9" width="18" height="18" fill="none"></rect><line class="chand" x1="0" y1="0" x2="0" y2="-6"></line></g></g><g class="done d2"><circle class="green" r="22"></circle><path class="check" d="M-8 0.5l5 5 10-11"></path></g></g>
<g transform="translate(430 204)"><circle class="nbase" r="22"></circle><text class="num" y="5">3</text><g class="act a3"><circle class="ring" r="22"></circle><circle class="blue" r="22"></circle><circle class="cface" r="9"></circle><line class="chand" x1="0" y1="0" x2="4" y2="2"></line><g class="hand"><rect x="-9" y="-9" width="18" height="18" fill="none"></rect><line class="chand" x1="0" y1="0" x2="0" y2="-6"></line></g></g><g class="done d3"><circle class="green" r="22"></circle><path class="check" d="M-8 0.5l5 5 10-11"></path></g></g>
<text class="lbl l1" x="130" y="256">Manager</text>
<text class="lbl l2" x="280" y="256">Finance</text>
<text class="lbl l3" x="430" y="256">Done</text>
<g class="card"><line class="conn" x1="115" y1="118" x2="115" y2="176"></line><rect class="cardbg" x="0" y="28" width="230" height="84" rx="14"></rect><circle class="dot" cx="210" cy="54" r="5"></circle><text class="id" x="18" y="60">PR-2026-00000042</text><text class="sub" x="18" y="88">Purchase request</text></g>
<circle class="tok" cx="130" cy="116" r="5"></circle>
<g class="pill"><rect class="pillbg" x="205" y="131" width="150" height="36" rx="18"></rect><path class="pchk" d="M231 149.5l4 4 8-9"></path><text class="pilltx" x="251" y="155">Approved</text></g>
</svg>
